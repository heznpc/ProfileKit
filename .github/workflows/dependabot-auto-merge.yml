name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7 # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor/patch updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label major updates for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          set -euo pipefail

          add_label_if_exists() {
            label="$1"
            if gh label list --search "$label" --json name --jq '.[].name' | grep -Fxq "$label"; then
              gh pr edit "$PR_URL" --add-label "$label"
            else
              echo "::notice title=Label missing::$label does not exist; skipping label assignment."
            fi
          }

          add_label_if_exists "dependencies"
          add_label_if_exists "manual-review"

          if gh label list --search "manual-review" --json name --jq '.[].name' | grep -Fxq "manual-review"; then
            echo "::notice title=Manual review required::Major dependency update left unmerged for manual review."
          else
            echo "::notice title=Manual review label missing::The manual-review label does not exist; leaving the major update unmerged."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
