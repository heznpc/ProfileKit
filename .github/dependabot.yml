# Dependabot v2 — GitHub Actions plus the small npm dev-tool surface.
#
# ProfileKit has zero runtime dependencies, but CI uses npm dev tooling
# from package-lock.json. Track that dev surface so audit/license gates are
# kept current instead of only discovering stale tools after install.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-minor:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
